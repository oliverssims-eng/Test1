<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voxel Monk Fighter</title>
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#000;
               font-family:"Segoe UI", Arial, sans-serif; user-select:none; }
  #game { display:block; width:100%; height:100%; }

  #hud { position:fixed; inset:0; pointer-events:none; }

  .bar-wrap { position:absolute; top:22px; width:36%; height:26px;
              background:rgba(0,0,0,.55); border:2px solid #111; border-radius:4px; }
  #pbar-wrap { left:3%; }
  #ebar-wrap { right:3%; }
  .bar { position:absolute; top:0; bottom:0; transition:width .12s ease-out; }
  #pbar { left:0; background:linear-gradient(#8be04a,#4f9e1d); }
  #ebar { right:0; background:linear-gradient(#ff7a5c,#c62b1a); }
  .bar-label { position:absolute; top:3px; color:#fff; font-size:13px; font-weight:700;
               text-shadow:0 1px 2px #000; padding:0 8px; }
  #pbar-wrap .bar-label { left:0; }
  #ebar-wrap .bar-label { right:0; }

  #msg { position:absolute; top:34%; width:100%; text-align:center; color:#fff;
         font-size:52px; font-weight:800; letter-spacing:2px;
         text-shadow:0 3px 10px rgba(0,0,0,.8); display:none; }
  #submsg { position:absolute; top:46%; width:100%; text-align:center; color:#ffd;
            font-size:20px; text-shadow:0 2px 6px #000; display:none; }

  #crosshair { position:absolute; left:50%; top:50%; width:6px; height:6px; margin:-3px;
               border-radius:50%; background:rgba(255,255,255,.75);
               box-shadow:0 0 4px rgba(0,0,0,.8); }

  #controls { position:absolute; left:16px; bottom:14px; color:#eee; font-size:13px;
              line-height:1.55; background:rgba(0,0,0,.45); padding:10px 14px;
              border-radius:6px; }
  #controls b { color:#ffcf6e; }

  #start { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
           justify-content:center; background:rgba(0,0,0,.65); color:#fff; cursor:pointer; }
  #start h1 { font-size:44px; margin:0 0 10px; letter-spacing:3px; text-shadow:0 3px 8px #000; }
  #start p { font-size:18px; color:#ffd98a; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="bar-wrap" id="pbar-wrap">
    <div class="bar" id="pbar" style="width:100%"></div>
    <div class="bar-label">MONK</div>
  </div>
  <div class="bar-wrap" id="ebar-wrap">
    <div class="bar" id="ebar" style="width:100%"></div>
    <div class="bar-label">CHALLENGER</div>
  </div>
  <div id="msg"></div>
  <div id="submsg"></div>
  <div id="crosshair"></div>
  <div id="controls">
    <b>WASD</b> move &nbsp;•&nbsp; <b>Mouse</b> camera<br>
    <b>Left Click</b> jab &nbsp;•&nbsp; <b>Right Click</b> heavy punch (breaks block)<br>
    <b>R</b> front kick &nbsp;•&nbsp; <b>G</b> haymaker &nbsp;•&nbsp; <b>F</b> hold to block<br>
    <b>Z</b> dropkick (breaks block, knocks down — leaves you on the floor!)
  </div>
</div>

<div id="start">
  <h1>VOXEL MONK FIGHTER</h1>
  <p>Click to enter the plain</p>
</div>

<script src="vendor/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
